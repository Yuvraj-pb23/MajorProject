<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LoanEase</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="logo-container">
        <img src="{% static 'images/Loaneaselogo.png' %}" alt="Loanease Logo" class="page-logo">
    </div>
    <div class="home-button-container">
        <a href="{% url 'home' %}" class="home-btn">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
    </div>
    <div class="page-wrapper">
        <div class="login-container">
            <!-- Left Side - Artistic Background -->
            <div class="left-section">
                <div class="content-overlay">
                    <h1>Welcome Back</h1>
                    <p>Continue your loan journey with us.</p>
                </div>
            </div>
        
            <!-- Right Side - Login Form -->
            <div class="right-section">
                <div class="form-container">
                    <div class="form-header">
                        <h2>Login</h2>
                    </div>
                    
                    <form action="{% url 'Dash' %}" method="POST" class="login-form" id="loginForm">
                        {% csrf_token %}
                        
                        <!-- Error Messages -->
                        {% if messages %}
                            <div class="messages">
                                {% for message in messages %}
                                    <div class="message {{ message.tags }}">
                                        {{ message }}
                                    </div>
                                {% endfor %}
                            </div>
                        {% endif %}
                        
                        <div class="input-group">
                            <input type="email" name="email" placeholder="Email address" required>
                            <div class="error-message" id="email-error"></div>
                        </div>
                        
                        <div class="input-group">
                            <input type="password" name="password" placeholder="Password" required id="password">
                            <div class="error-message" id="password-error"></div>
                        </div>
                        
                        <div class="form-options">
                            <div class="checkbox-group">
                                <input type="checkbox" id="remember" name="remember">
                                <label for="remember">Remember me</label>
                            </div>
                            <a href="#" class="forgot-password">Forgot password?</a>
                        </div>
                        
                        <button type="submit" class="login-btn">
                            Login <i class="fas fa-arrow-right"></i>
                        </button>
                    </form>
                    
                    <div class="signup-link">
                        <p>Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('loginForm');

            // Form submission validation
            form.addEventListener('submit', function(e) {
                let isValid = true;

                // Clear previous errors
                document.querySelectorAll('.error-message').forEach(div => div.textContent = '');

                // Validate email
                const email = document.querySelector('input[name="email"]').value.trim();
                if (!email || !email.includes('@')) {
                    document.getElementById('email-error').textContent = 'Please enter a valid email address';
                    isValid = false;
                }

                // Validate password
                const password = document.getElementById('password').value;
                if (password.length < 1) {
                    document.getElementById('password-error').textContent = 'Password is required';
                    isValid = false;
                }

                if (!isValid) {
                    e.preventDefault();
                }
            });
        });
    </script>
</body>
</html>
